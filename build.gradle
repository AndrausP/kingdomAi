plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = mod_version
group = 'com.kingdomsai'
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Testes do Core (sem Minecraft): ./gradlew coreTest
tasks.register('coreTest', JavaExec) {
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.kingdomsai.core.CoreSelfTest'
    jvmArgs '-Dstdout.encoding=UTF-8'
}
